<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Escape Room</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Simple Escape Room</h1>
    <p>Solve the code to escape!</p>

    <div class="lock">
      <label for="codeInput">Enter 4-digit code:</label>
      <input type="text" id="codeInput" maxlength="4" aria-label="Enter 4-digit code" />
      <button id="submitBtn">Unlock</button>
    </div>

    <button id="showClueBtn">Show Clue</button>

    <!-- Popup Clue -->
    <div id="cluePopup" class="popup" role="dialog" aria-modal="true" aria-labelledby="clueTitle" aria-hidden="true">
      <div class="popup-content">
        <h2 id="clueTitle">Clue</h2>
        <p>The code is the year the first man landed on the moon.</p>
        <button id="closeClueBtn" aria-label="Close clue popup">Close</button>
      </div>
    </div>

    <!-- Win Popup -->
    <div id="winPopup" class="popup" role="dialog" aria-modal="true" aria-labelledby="winTitle" aria-hidden="true">
      <div class="popup-content">
        <h2 id="winTitle">🎉 You Escaped! 🎉</h2>
        <button id="playAgainBtn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
